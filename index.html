
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Disha Phlebo Cloud</title>
    
    <!-- Theme & Mobile Discovery -->
    <meta name="theme-color" content="#5F259F">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Apple IPA Specific Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Disha Phlebo">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063176.png">
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Handles the 'Notch' and 'Home Indicator' on modern iOS/Android devices */
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            background-color: #F8FAFC;
            user-select: none;
            /* Prevent scrolling past the edges on mobile */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: var(--sat) var(--sar) var(--sab) var(--sal);
        }
        
        #root {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .text-brand-green { color: #29A643; }
        .text-brand-purple { color: #5F259F; }
        .bg-brand-purple { background-color: #5F259F; }
        .border-brand-purple { border-color: #5F259F; }
        .bg-brand-green { background-color: #29A643; }
        .brand-gradient { background: linear-gradient(135deg, #FFB800 0%, #FF7A00 100%); }
        
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .animate-shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .animate-border-flash-red {
            animation: borderFlashRed 1s infinite;
        }
        @keyframes borderFlashRed {
            0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            50% { border-color: transparent; box-shadow: 0 0 0px transparent; }
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

}
